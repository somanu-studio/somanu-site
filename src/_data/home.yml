# How it works
approach_title: |-
  You can see it.
  But it needs structure.
  That’s where SOMANÚ comes in.
approach_text: |-
  I step into your world. I listen, observe and understand what already exists inside the project — then help bring clarity, structure and direction to it.

  No fixed formulas, no rigid frameworks: a flexible support and an action plan shaped around your reality.
approach_image: /assets/images/tattoo-do-it.jpg
approach_image_alt: Close-up of a wrist with a small “do it.” tattoo, next to an iced tea and a laptop
